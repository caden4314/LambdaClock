<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lambda Clock</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  main{
    width:100vw;height:100svh;
    padding:max(env(safe-area-inset-top),10px) max(env(safe-area-inset-right),10px) max(env(safe-area-inset-bottom),10px) max(env(safe-area-inset-left),10px);
    display:grid;grid-template-rows:20svh 1fr;
    background:#000;
  }
  #time{
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(58px,18vw,150px);font-weight:300;letter-spacing:-.055em;
    font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;user-select:none;
  }
  #display{position:relative;min-height:0;overflow:hidden}
  svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
  .wire{fill:none;stroke:#fff;stroke-width:1.7;vector-effect:non-scaling-stroke;stroke-linecap:square;stroke-linejoin:miter}
  .faint{opacity:.14}
  #diagram{transform-origin:50% 8%;transition:opacity .16s linear,transform .16s ease-out}
  #diagram.reducing{opacity:.2;transform:scaleY(.975)}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .62s cubic-bezier(.2,.75,.15,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  #sweep{opacity:0}
  #sweep.go{animation:sweep .55s ease-out}
  @keyframes sweep{0%{opacity:0;transform:translateY(-25%)}20%{opacity:.6}100%{opacity:0;transform:translateY(90%)}}
  @media (orientation:landscape){main{grid-template-rows:26svh 1fr}#time{font-size:clamp(48px,12vw,108px)}}
  @media (prefers-reduced-motion:reduce){#diagram{transition:none}.draw,#sweep.go{animation:none}}
</style>
</head>
<body>
<main>
  <div id="time">--:--:--</div>
  <div id="display">
    <svg id="svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMin meet" aria-label="Animated lambda calculus diagram encoding the current time">
      <g id="oldDiagram" class="faint"></g>
      <g id="diagram"></g>
      <path id="sweep" class="wire" d="M0 0H1200"/>
    </svg>
  </div>
</main>
<script>
(() => {
  'use strict';
  const NS='http://www.w3.org/2000/svg';
  const timeEl=document.getElementById('time');
  const diagram=document.getElementById('diagram');
  const oldDiagram=document.getElementById('oldDiagram');
  const sweep=document.getElementById('sweep');
  let lastSecond=-1;
  let lastPaths=[];

  const V=(name,binder)=>({t:'v',name,binder});
  const L=(name,body)=>({t:'l',name,body,id:Symbol(name)});
  const A=(a,b)=>({t:'a',a,b});

  function church(n){
    const f={name:'f'}, x={name:'x'};
    let body=V('x',x);
    for(let i=0;i<n;i++) body=A(V('f',f),body);
    const lx=L('x',body); lx.bind=x;
    const lf=L('f',lx); lf.bind=f;
    return lf;
  }

  // One closed lambda term for all six digits: λp. p d0 d1 d2 d3 d4 d5
  // Each dN is the Church numeral for that clock digit.
  function timeTerm(ds){
    const p={name:'p'};
    let body=V('p',p);
    for(const d of ds) body=A(body,church(d));
    const root=L('p',body); root.bind=p;
    return root;
  }

  function leaves(node,out=[]){
    if(node.t==='v') out.push(node);
    else if(node.t==='l') leaves(node.body,out);
    else { leaves(node.a,out); leaves(node.b,out); }
    return out;
  }

  function layout(root){
    const vars=leaves(root,[]);
    const margin=32;
    const usable=1136;
    vars.forEach((v,i)=>v.x=margin+(vars.length===1?usable/2:i*usable/(vars.length-1)));

    const lines=[];
    const verticalEnds=new Map();
    const binderY=new Map();
    const binderRange=new Map();

    function scanBinders(n,depth=0){
      if(n.t==='l'){
        const y=28+depth*19;
        const xs=leaves(n.body,[]).map(v=>v.x);
        binderY.set(n.bind,y);
        binderRange.set(n.bind,[Math.min(...xs)-5,Math.max(...xs)+5]);
        scanBinders(n.body,depth+1);
      } else if(n.t==='a') { scanBinders(n.a,depth); scanBinders(n.b,depth); }
    }
    scanBinders(root);

    function leftmost(n){return leaves(n,[])[0].x}
    function appDepth(n,d=0){
      if(n.t==='a') return Math.max(appDepth(n.a,d+1),appDepth(n.b,d+1));
      if(n.t==='l') return appDepth(n.body,d);
      return d;
    }
    const maxApp=Math.max(1,appDepth(root));

    function scanApps(n,depth=0){
      if(n.t==='a'){
        const y=170 + (depth/maxApp)*480;
        const x1=leftmost(n.a), x2=leftmost(n.b);
        lines.push(`M${x1.toFixed(1)} ${y.toFixed(1)}H${x2.toFixed(1)}`);
        for(const v of leaves(n,[])) verticalEnds.set(v,Math.max(verticalEnds.get(v)||0,y));
        scanApps(n.a,depth+1); scanApps(n.b,depth+1);
      } else if(n.t==='l') scanApps(n.body,depth);
    }
    scanApps(root);

    for(const [b,y] of binderY){
      const [x1,x2]=binderRange.get(b);
      lines.push(`M${x1.toFixed(1)} ${y.toFixed(1)}H${x2.toFixed(1)}`);
    }
    for(const v of vars){
      const y1=binderY.get(v.binder) ?? 8;
      const y2=Math.max(y1+22,verticalEnds.get(v)||650);
      lines.push(`M${v.x.toFixed(1)} ${y1.toFixed(1)}V${Math.min(690,y2).toFixed(1)}`);
    }
    return lines;
  }

  function pathEl(d,animate=false){
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('class','wire'+(animate?' draw':''));
    if(animate){
      const len=900;
      p.style.strokeDasharray=len;
      p.style.strokeDashoffset=len;
      p.style.setProperty('--dummy','1');
      requestAnimationFrame(()=>{p.style.transition='stroke-dashoffset .62s cubic-bezier(.2,.75,.15,1)';p.style.strokeDashoffset='0';});
    }
    return p;
  }

  function fmt(d){
    let h=d.getHours()%12;if(h===0)h=12;
    return String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  }

  function tick(){
    const now=new Date();
    timeEl.textContent=fmt(now);
    if(now.getSeconds()===lastSecond) return;
    lastSecond=now.getSeconds();

    const h=now.getHours()%12||12;
    const digits=[Math.floor(h/10),h%10,Math.floor(now.getMinutes()/10),now.getMinutes()%10,Math.floor(now.getSeconds()/10),now.getSeconds()%10];
    const nextPaths=layout(timeTerm(digits));

    diagram.classList.add('reducing');
    oldDiagram.replaceChildren(...lastPaths.map(d=>pathEl(d,false)));
    setTimeout(()=>{
      diagram.replaceChildren(...nextPaths.map(d=>pathEl(d,true)));
      diagram.classList.remove('reducing');
      sweep.classList.remove('go');
      void sweep.getBoundingClientRect();
      sweep.classList.add('go');
      lastPaths=nextPaths;
    },110);
  }

  tick();
  setInterval(tick,100);
})();
</script>
</body>
</html>
