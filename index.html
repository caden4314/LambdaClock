<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lambda Clock</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  main{
    width:100vw;height:100svh;
    padding:max(env(safe-area-inset-top),10px) max(env(safe-area-inset-right),10px) max(env(safe-area-inset-bottom),10px) max(env(safe-area-inset-left),10px);
    display:grid;grid-template-rows:20svh 1fr;background:#000;
  }
  #time{
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(58px,18vw,150px);font-weight:300;letter-spacing:-.055em;
    font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;user-select:none;
  }
  #display{position:relative;min-height:0;overflow:hidden}
  svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
  .wire{
    fill:none;stroke:#fff;stroke-width:1.7;vector-effect:non-scaling-stroke;
    stroke-linecap:square;stroke-linejoin:miter;
  }
  @media (orientation:landscape){
    main{grid-template-rows:26svh 1fr}
    #time{font-size:clamp(48px,12vw,108px)}
  }
</style>
</head>
<body>
<main>
  <div id="time">--:--:--</div>
  <div id="display">
    <svg id="svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMin meet"
         aria-label="Animated lambda calculus diagram encoding the current time">
      <g id="diagram"></g>
    </svg>
  </div>
</main>
<script>
(() => {
  'use strict';

  const NS='http://www.w3.org/2000/svg';
  const timeEl=document.getElementById('time');
  const diagram=document.getElementById('diagram');
  const reducedMotion=window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let lastStamp='';
  let animationId=0;
  const live=new Map();

  const V=(name,binder,key)=>({t:'v',name,binder,key});
  const L=(name,body,key)=>({t:'l',name,body,key,bind:null});
  const A=(a,b,key)=>({t:'a',a,b,key});

  function church(n,slot){
    const f={name:'f',key:`d${slot}:f`};
    const x={name:'x',key:`d${slot}:x`};

    let body=V('x',x,`d${slot}:x-ref`);
    for(let i=0;i<n;i++){
      body=A(
        V('f',f,`d${slot}:f-ref:${i}`),
        body,
        `d${slot}:app:${i}`
      );
    }

    const lx=L('x',body,`d${slot}:lambda:x`);
    lx.bind=x;
    const lf=L('f',lx,`d${slot}:lambda:f`);
    lf.bind=f;
    return lf;
  }

  function timeTerm(ds){
    const p={name:'p',key:'time:p'};
    let body=V('p',p,'time:p-ref');

    ds.forEach((d,slot)=>{
      body=A(body,church(d,slot),`time:app:${slot}`);
    });

    const root=L('p',body,'time:lambda:p');
    root.bind=p;
    return root;
  }

  function leaves(node,out=[]){
    if(node.t==='v') out.push(node);
    else if(node.t==='l') leaves(node.body,out);
    else{
      leaves(node.a,out);
      leaves(node.b,out);
    }
    return out;
  }

  function leftmost(node){
    return leaves(node,[])[0].x;
  }

  function layout(root){
    const vars=leaves(root,[]);
    const margin=32;
    const usable=1136;

    vars.forEach((v,i)=>{
      v.x=margin+(vars.length===1 ? usable/2 : i*usable/(vars.length-1));
    });

    const segments=[];
    const verticalEnds=new Map();
    const binderY=new Map();
    const binderRange=new Map();

    function add(id,x1,y1,x2,y2){
      segments.push({id,x1,y1,x2,y2});
    }

    function scanBinders(n,depth=0){
      if(n.t==='l'){
        const y=28+depth*19;
        const xs=leaves(n.body,[]).map(v=>v.x);
        binderY.set(n.bind,y);
        binderRange.set(n.bind,{
          id:`lambda:${n.key}`,
          x1:Math.min(...xs)-5,
          x2:Math.max(...xs)+5
        });
        scanBinders(n.body,depth+1);
      }else if(n.t==='a'){
        scanBinders(n.a,depth);
        scanBinders(n.b,depth);
      }
    }

    function appDepth(n,d=0){
      if(n.t==='a') return Math.max(appDepth(n.a,d+1),appDepth(n.b,d+1));
      if(n.t==='l') return appDepth(n.body,d);
      return d;
    }

    function scanApps(n,depth=0,maxApp=1){
      if(n.t==='a'){
        const y=170+(depth/maxApp)*480;
        const x1=leftmost(n.a);
        const x2=leftmost(n.b);

        add(`app:${n.key}`,x1,y,x2,y);

        for(const v of leaves(n,[])){
          verticalEnds.set(v,Math.max(verticalEnds.get(v)||0,y));
        }

        scanApps(n.a,depth+1,maxApp);
        scanApps(n.b,depth+1,maxApp);
      }else if(n.t==='l'){
        scanApps(n.body,depth,maxApp);
      }
    }

    scanBinders(root);
    const maxApp=Math.max(1,appDepth(root));
    scanApps(root,0,maxApp);

    for(const [binder,y] of binderY){
      const r=binderRange.get(binder);
      add(r.id,r.x1,y,r.x2,y);
    }

    for(const v of vars){
      const y1=binderY.get(v.binder) ?? 8;
      const y2=Math.min(690,Math.max(y1+22,verticalEnds.get(v)||650));
      add(`var:${v.key}`,v.x,y1,v.x,y2);
    }

    return segments;
  }

  function makeLine(){
    const line=document.createElementNS(NS,'line');
    line.setAttribute('class','wire');
    diagram.appendChild(line);
    return line;
  }

  function setGeom(item,g,opacity){
    item.geom={...g};
    item.opacity=opacity;
    const el=item.el;
    el.setAttribute('x1',g.x1.toFixed(2));
    el.setAttribute('y1',g.y1.toFixed(2));
    el.setAttribute('x2',g.x2.toFixed(2));
    el.setAttribute('y2',g.y2.toFixed(2));
    el.style.opacity=String(opacity);
  }

  function collapseGeom(g){
    if(Math.abs(g.x2-g.x1)>=Math.abs(g.y2-g.y1)){
      return {x1:g.x1,y1:g.y1,x2:g.x1,y2:g.y1};
    }
    return {x1:g.x1,y1:g.y1,x2:g.x1,y2:g.y1};
  }

  function lerp(a,b,t){
    return a+(b-a)*t;
  }

  function ease(t){
    return 1-Math.pow(1-t,3);
  }

  function morph(nextSegments){
    const token=++animationId;
    const next=new Map(nextSegments.map(s=>[s.id,s]));
    const jobs=[];

    for(const seg of nextSegments){
      const existing=live.get(seg.id);

      if(existing){
        jobs.push({
          id:seg.id,
          item:existing,
          from:{...existing.geom},
          to:{...seg},
          fromOpacity:existing.opacity ?? 1,
          toOpacity:1,
          remove:false
        });
      }else{
        const item={el:makeLine(),geom:null,opacity:0};
        const from=collapseGeom(seg);
        setGeom(item,from,0);
        live.set(seg.id,item);

        jobs.push({
          id:seg.id,
          item,
          from,
          to:{...seg},
          fromOpacity:0,
          toOpacity:1,
          remove:false
        });
      }
    }

    for(const [id,item] of [...live]){
      if(next.has(id)) continue;

      jobs.push({
        id,
        item,
        from:{...item.geom},
        to:collapseGeom(item.geom),
        fromOpacity:item.opacity ?? 1,
        toOpacity:0,
        remove:true
      });
    }

    if(reducedMotion){
      for(const job of jobs){
        if(job.remove){
          job.item.el.remove();
          live.delete(job.id);
        }else{
          setGeom(job.item,job.to,1);
        }
      }
      return;
    }

    const start=performance.now();
    const duration=720;

    function frame(now){
      if(token!==animationId) return;

      const raw=Math.min(1,(now-start)/duration);
      const t=ease(raw);

      for(const job of jobs){
        const g={
          x1:lerp(job.from.x1,job.to.x1,t),
          y1:lerp(job.from.y1,job.to.y1,t),
          x2:lerp(job.from.x2,job.to.x2,t),
          y2:lerp(job.from.y2,job.to.y2,t)
        };
        const op=lerp(job.fromOpacity,job.toOpacity,t);
        setGeom(job.item,g,op);
      }

      if(raw<1){
        requestAnimationFrame(frame);
        return;
      }

      for(const job of jobs){
        if(job.remove){
          job.item.el.remove();
          live.delete(job.id);
        }else{
          setGeom(job.item,job.to,1);
        }
      }
    }

    requestAnimationFrame(frame);
  }

  function fmt(d){
    let h=d.getHours()%12;
    if(h===0) h=12;
    return String(h).padStart(2,'0')+':'+
      String(d.getMinutes()).padStart(2,'0')+':'+
      String(d.getSeconds()).padStart(2,'0');
  }

  function digitsFor(d){
    const h=d.getHours()%12||12;
    return [
      Math.floor(h/10),h%10,
      Math.floor(d.getMinutes()/10),d.getMinutes()%10,
      Math.floor(d.getSeconds()/10),d.getSeconds()%10
    ];
  }

  function tick(){
    const now=new Date();
    const stamp=fmt(now);
    timeEl.textContent=stamp;

    if(stamp===lastStamp) return;
    lastStamp=stamp;

    morph(layout(timeTerm(digitsFor(now))));
  }

  tick();
  setInterval(tick,100);
})();
</script>
</body>
</html>
